name: run-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
            filament: '^4.0'
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
            filament: '^5.0'
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
            filament: '^4.0'
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
            filament: '^5.0'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - F${{ matrix.filament }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "filament/forms:${{ matrix.filament }}" \
            "filament/infolists:${{ matrix.filament }}" \
            "filament/support:${{ matrix.filament }}" \
            --no-interaction --no-update
          composer update --with-all-dependencies --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show

      - name: Validate composer metadata
        run: composer validate --no-check-publish

      - name: Lint PHP
        run: composer lint

      - name: Run PHPStan
        run: composer phpstan

      - name: Execute tests
        run: composer test -- --ci
